name: MiniEssentials
description: $description
version: '${version}'

main: net.omni.miniEssentials.MiniEssentials
api-version: '26.1.2'
load: POSTWORLD

authors: [ domninos ]

commands:
  enderchest:
    usage: /<command> [player]
    description: Opens your enderchest or someone else's.
  fix:
    usage: /<command>
    description: Restores the durability of your current item in main hand.
  gamemode:
    usage: /<command> <type> [player]
    description: Changes your gamemode or someone else's gamemode.
  god:
    usage: /<command> [player]
    description: Gives you or someone else immunity to damage or hunger.
  openinv:
    usage: /<command> <player>
    description: Opens the player's inventory and enables you to edit in real-time.
  tpa:
    usage: /<command> <player>
    description: Sends a teleport request to the player.
  trash:
    usage: /<command>
    description: Opens a menu which lets you throw away items. All of the items which go in the menu are removed when the menu is closed.
